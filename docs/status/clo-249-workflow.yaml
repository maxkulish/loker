task_type: specification
classification_reason: |
  Single-module mechanical change: centralise `genai::Error -> BackendError`
  translation behind a single `From` impl, tag retryability, document the
  mapping. The `BackendError` enum already exists in `src/backend/mod.rs`
  with `is_retryable()` semantics; the enum is only extended if a real
  observed `genai::Error` variant has nowhere to land. Acceptance criteria
  are testable (unit tests pin each variant -> mapped result + retryability).
  No architecture decisions required - the /spec workflow fits, mirroring
  CLO-247's specification path.

