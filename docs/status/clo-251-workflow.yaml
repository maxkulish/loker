task_id: CLO-251
task_title: "Add BackendCapabilities struct (FR-4)"
task_url: "https://linear.app/cloud-ai/issue/CLO-251/add-backendcapabilities-struct-fr-4"
task_type: specification
classification_reason: |
  Single-concept structural addition: define `BackendCapabilities { tool_use,
  streaming, file_edit }`, extend the `Backend` trait with `capabilities()`,
  implement honestly per backend, and add a load-time `Workflow::validate`
  pass that refuses phases whose strategy or verify-hook list demands a
  capability the backend lacks. The `Backend` trait already exists
  (src/backend/mod.rs:252-262); `Workflow::validate()` already exists
  (src/workflow.rs:119) with `WorkflowError` variants. Acceptance criteria
  are mechanically testable (unit tests pin each backend's capability set;
  validation test for tool-use phase on a tool-incapable backend). No
  architecture decisions required - the PRD already specifies the three
  capabilities. /spec workflow fits, mirroring CLO-247/248/249.

