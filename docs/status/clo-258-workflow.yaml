task:
  status: complete
  problem: "Add the M2 EscalatingRetry strategy walker: try backends cheap-to-strong, verify successful backend outputs, stop at the first verify pass, and return structured exhaustion when no backend passes."
  acceptance_criteria:
    - "Strategy::EscalatingRetry carries ordered backends, verify hook, and pass_failure_context scaffold defaulting false."
    - "First-pass success returns immediately and does not call later backends."
    - "Mid-list pass returns the winning attempt while preserving earlier attempts."
    - "Full exhaustion returns PhaseError::Exhausted with all attempt records."
    - "Retryability flags decide whether a backend-level retryable error burns/retries the current slot before moving on; non-retryable errors do not skip subsequent backends."
    - "A phase-result shape test covers the escalating output contract."
  validation:
    - "cargo test -q strategy::"
    - "cargo test -q run_artefact_schemas_validate_their_fixtures"
    - "make check"

