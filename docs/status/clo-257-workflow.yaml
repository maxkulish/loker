task_id: CLO-257
task_title: "Implement Strategy::SingleModel"
task_url: "https://linear.app/cloud-ai/issue/CLO-257/implement-strategysinglemodel"
task_type: specification
classification_reason: |
  Single-concept structural addition: define the `Strategy` trait (shape
  pre-specified by loker-design.md §4.2: `async fn execute(&self,
  backends, prompt, ctx) -> Result<StrategyOutput, StrategyError>`) and
  implement the simplest variant `SingleModel { backend, prompt_template }`.
  Mock-backend unit tests cover happy path and error pass-through.
  Acceptance criteria are mechanically testable (one call out / one
  response in / no retry / no aggregation; trait extensible without
  breaking SingleModel call sites; produced phase result file matches D2
  schema). No architecture decisions needed beyond what design doc §4.2
  already specifies. Mirrors approved approach for CLO-247/248/249/251.

