    decisions_recorded:
      - "Canonical artefacts live at runs/<id>/<phase>/<artefact> and are committed via tmp+rename+fsync (NamedTempFile::persist + parent-dir sync_all in Rust). Failed attempts archived to attempts/<phase>/<n>/. Symlink/pointer alternative rejected due to portability + reader-path complexity."
      - "Per-phase commit order: started -> artefact -> manifest -> completed. markers/<phase>.completed is the single source of truth - its absence forces rerun even if artefact + manifest appear complete."
      - "Manifest is full-rewrite-via-tmp-rename, not text-append. Avoids partial-line corruption. Cheap because manifests are small. manifest_entry_sha256 is the authoritative key for completed phases; completed marker's artefact_paths is a denormalised debug hint."
      - "Heartbeat with 5min default TTL distinguishes alive-writer from dead-writer; advisory .lock in T-031 reinforces parallel-writer detection."
      - "14-row kill matrix specified for T-031 crash-injection tests, scoped to process-crash semantics via std::process::abort. Rows 6 and 11 (power-loss) require a separate harness. Row 9 (kill between manifest and phase.completed) requires T-024 to implement orphan-entry sweep on resume."
      - "Started marker is rewritten on every attempt with current attempt value (self-describing); resolves contradiction surfaced in PR review."
      - "Stale-tmp sweep uses portable YYYYMMDDTHHMMSSZ timestamp (no colons) so paths remain Windows-safe."
