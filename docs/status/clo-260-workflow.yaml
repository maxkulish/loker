  FailureContext payload, plumb into next stage's prompt envelope,
  reuse existing redaction filter, document byte budget, lock
  injection location. Acceptance criteria are mechanically
  testable (config round-trip, snapshot of off-state, four
  wiremock cases for on-state). No architecture decisions
  remain. Mirrors approved approach for CLO-247/248/249/251/257.
