classification_reason: |
  Single-concept feature flag addition on top of merged CLO-258 walker.
  Architecture decisions already made: PRD FR-8 specifies failure
  context propagation; design doc §6 covers escalating retry shape;
  §11 covers redaction. Scaffold field `pass_failure_context: bool`
  was already added to the EscalatingRetry stage in CLO-258
