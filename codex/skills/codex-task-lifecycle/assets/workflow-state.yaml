# Codex-compatible workflow state file.
# Location: docs/status/<task-id>-workflow.yaml
# Purpose: Persist task lifecycle state in the same shape used by the legacy
# workflow so Claude and Codex can hand off safely.

task_id: CLO-000
linear_url: https://linear.app/cloud-ai/issue/CLO-000
title: ""
branch: ""
task_type: development
created: ""
updated_at: ""

workflow:
  # Compatible persisted phases:
  #   design -> plan -> implement -> pr -> complete
  # Codex's user-facing flow maps onto these phases:
  #   task: missing/new state file initialization
  #   design + design review: design
  #   implementation plan: plan
  #   implementation + review before PR: implement
  #   PR + PR fixes: pr
  #   done: complete
  current_phase: design
  status: awaiting_input

phases:
  design:
    status: pending
    design_doc: null
    draft_ready: false
    finalized: false
    review_completed: false
    review_verdict: null
    review_applied: false
    applied_suggestions: []
    flagged_suggestions: []
    # Codex-specific compatible extension fields.
    codex_review: null

  spec:
    status: skipped
    spec_file: null
    approved: false

  plan:
    status: pending
    plan_file: null
    approved: false

  implement:
    status: pending
    current_step: 0
    total_steps: 0
    commits: []
    last_phase_completed: null
    codex_validated: false
    codex_verdict: null
    codex_report: null
    gemini_validation_report: null
    # Codex-specific compatible extension fields.
    codex_changed_files: []
    codex_tests_run: []
    codex_open_risks: []

  pr:
    status: pending
    pr_url: null
    pr_number: null
    reviews_addressed: 0
    approved: false
    ci_passed: false
    # Codex-specific compatible extension fields.
    codex_validation: []
    codex_fix_rounds: 0
    codex_checks: []
    codex_unresolved_threads: []

  complete:
    status: pending
    aggregation_files_updated: false
    merged_at: null
    # Codex-specific compatible extension fields.
    codex_completed_at: null
    codex_summary: ""

history: []
