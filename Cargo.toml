[package]
name = "loker"
version = "20260510.0.0"
edition = "2021"
rust-version = "1.80"
description = "LLM orchestration: cross-family aggregation, escalating retry, verify hooks"
authors = ["Max Kulish"]
license = "MIT"
repository = "https://github.com/maxkulish/loker"
homepage = "https://github.com/maxkulish/loker"
documentation = "https://docs.rs/loker"

readme = "README.md"
keywords = ["llm", "orchestration", "consensus", "verify", "routing"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".bundle/",
    ".gems/",
    ".npm-global/",
    "log/",
    "tmp/",
    "target/",
]

[[bin]]
name = "loker"
path = "src/main.rs"

[features]
default = []
bedrock = ["aws-config", "aws-sdk-bedrockruntime"]

[dependencies]
tokio = { version = "1", features = ["full", "process"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-trait = "0.1"
indicatif = "0.17"
colored = "2"
anyhow = "1"
thiserror = "2"
dirs = "5"
fs2 = "0.4"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
genai = "0.6.0-beta.17"
sha2 = "0.10"
secrecy = "0.10"
regex = "1"
which = "7"
aws-config = { version = "1", optional = true }
aws-sdk-bedrockruntime = { version = "1", optional = true }
chrono = { version = "0.4.43", features = ["serde"] }
minijinja = "2"
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
slug = "0.1.6"
axum = "0.7"
tower = "0.5"
askama = "0.12"
notify = "8.2.0"
tokio-stream = "0.1.18"
tracing = "0.1.44"
async-stream = "0.3"
mime_guess = "2.0.5"
percent-encoding = "2.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
jsonschema = "0.46"
insta = "1.47.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
