name = "design-review"
description = "Multi-model design document review with output validation and Claude fallback"

# Step 1: Pre-flight health check - fast-fail if models are unreachable
[[steps]]
name = "health_check"
timeout = 30000
continue_on_error = true
shell = """
GEMINI_OK=false
OLLAMA_OK=false

if timeout 10 gemini --model "${GEMINI_MODEL:-gemini-3.1-pro-preview}" -p "reply OK" -o text 2>/dev/null | grep -qi "ok"; then
  GEMINI_OK=true
fi

if timeout 10 ollama list 2>/dev/null | grep -q .; then
  OLLAMA_OK=true
fi

echo "gemini=$GEMINI_OK ollama=$OLLAMA_OK"
"""

# Step 2: Gemini review with fallback model support
[[steps]]
name = "gemini_review"
timeout = 300000
retries = 3
continue_on_error = true
depends_on = ["health_check"]
shell = """
if ! timeout 10 gemini --model "${GEMINI_MODEL:-gemini-3.1-pro-preview}" -p "reply OK" -o text 2>/dev/null | grep -qi "ok"; then
  echo "REVIEW_FAILED: Gemini CLI unreachable (pre-flight check failed)"
  exit 0
fi

PROMPT=$(sed 's|__DOC_PATH__|{{ arg.1 }}|g' .lok/prompts/design-review-prompt.md)
PRIMARY_MODEL="${GEMINI_MODEL:-gemini-3.1-pro-preview}"
FALLBACK_MODEL="${GEMINI_FALLBACK_MODEL:-gemini-2.5-pro}"

OUTPUT=$(timeout 300 gemini --model "$PRIMARY_MODEL" -y --sandbox \
  --include-directories docs,src,tests \
  -p "$PROMPT" -o text 2>/tmp/lok-gemini-stderr.log)

if [ -z "$OUTPUT" ] || [ $(printf '%s' "$OUTPUT" | wc -c) -lt 100 ]; then
  OUTPUT=$(timeout 300 gemini --model "$FALLBACK_MODEL" -y --sandbox \
    --include-directories docs,src,tests \
    -p "$PROMPT" -o text 2>/tmp/lok-gemini-stderr.log)

  if [ -z "$OUTPUT" ] || [ $(printf '%s' "$OUTPUT" | wc -c) -lt 100 ]; then
    STDERR=$(head -5 /tmp/lok-gemini-stderr.log 2>/dev/null || echo "no stderr")
    echo "REVIEW_FAILED: Empty output from both $PRIMARY_MODEL and $FALLBACK_MODEL (stderr: $STDERR)"
    exit 0
  fi
fi

echo "$OUTPUT"
"""

[steps.validate]
check = "min_length(200)"
backend = "claude"
model = "haiku"
replace_output = false
max_input_length = 100000
timeout_ms = 60000
on_error = "pass"
on_parse_error = "pass"
prompt = """
{{ output }}

---

You are a review output validator. Produce ONE JSON object as your entire response. No prose. No markdown code fences.

VALID review: has numbered sections (## 1., ## 2.), assessment language, a verdict (APPROVE/APPROVE_WITH_SUGGESTIONS/NEEDS_REVISION), actionable feedback.
NOISE (not a review): MCP initialization messages, timestamps only, stack traces, empty content, greetings without analysis.

If valid review: {"status": "pass"}
If noise/garbage: {"status": "fail", "reason": "<one-line reason>"}
"""

# Step 3: Ollama/OpenCode review with empty output short-circuit
# Uses `ollama launch opencode` with --yes (non-interactive) and opencode's
# --dangerously-skip-permissions for unattended execution.
[[steps]]
name = "ollama_review"
timeout = 600000
retries = 2
continue_on_error = true
depends_on = ["health_check"]
shell = """
if ! timeout 10 ollama list 2>/dev/null | grep -q .; then
  echo "REVIEW_FAILED: Ollama CLI unreachable (pre-flight check failed)"
  exit 0
fi

PROMPT=$(sed 's|__DOC_PATH__|{{ arg.1 }}|g' .lok/prompts/design-review-prompt.md)

OUTPUT=$(timeout 570 ollama launch opencode --yes --model "${OLLAMA_MODEL:-glm-5.1:cloud}" -- \
  run --dangerously-skip-permissions "$PROMPT" 2>/tmp/lok-ollama-stderr.log)

if [ -z "$OUTPUT" ] || [ $(printf '%s' "$OUTPUT" | wc -c) -lt 100 ]; then
  STDERR=$(head -5 /tmp/lok-ollama-stderr.log 2>/dev/null || echo "no stderr")
  echo "REVIEW_FAILED: Empty or trivially short output from Ollama (stderr: $STDERR)"
  exit 0
fi

echo "$OUTPUT"
"""

[steps.validate]
check = "min_length(200)"
backend = "claude"
model = "haiku"
replace_output = false
max_input_length = 100000
timeout_ms = 60000
on_error = "pass"
on_parse_error = "pass"
prompt = """
{{ output }}

---

You are a review output validator. Produce ONE JSON object as your entire response. No prose. No markdown code fences.

VALID review: has numbered sections (## 1., ## 2.), assessment language, a verdict (APPROVE/APPROVE_WITH_SUGGESTIONS/NEEDS_REVISION), actionable feedback.
NOISE: empty content, timestamps only, error messages, partial output with missing sections.

If valid review: {"status": "pass"}
If noise/garbage: {"status": "fail", "reason": "<one-line reason>"}
"""

# Step 4: Claude fallback review - runs only when both external models failed
[[steps]]
name = "claude_fallback"
backend = "claude"
timeout = 120000
retries = 2
continue_on_error = true
depends_on = ["gemini_review", "ollama_review"]
when = "not steps.gemini_review.success and not steps.ollama_review.success"
prompt = """
Both external reviewers (Gemini and Ollama) failed to produce a review. You are the fallback reviewer for **loker** — a Rust CLI tool for multi-LLM orchestration.

Read the design document and produce a structured review.

DESIGN DOCUMENT PATH: {{ arg.1 }}

Read these files for context:
1. {{ arg.1 }} - The design document to review
2. docs/handoff.md - Project intent, constraints, conventions
3. docs/prd/2026-04-25-loker.md - Product requirements
4. docs/plans/001-implementation-roadmap.md - Milestone and task roadmap
5. docs/security/ - Threat models (list and read relevant)
6. docs/specs/ - Schema specs (list and read relevant)
7. CLAUDE.md - Active milestone and pre-merge gate

PROJECT CONTEXT:
- Active milestone: M1 - TensorZero backend
- Linear workspace: cloud-ai
- Issue prefix: CLO
- Pre-merge gate: `make check` (fmt + clippy + test)

REVIEW CRITERIA:
1. COMPLETENESS - all sections present and meaningful
2. ARCHITECTURE QUALITY - design patterns, error handling
3. ALIGNMENT - with docs/handoff.md intent and active milestone
4. CODE QUALITY - clean Rust interfaces, proper trait abstractions
5. SECURITY POSTURE - no hardcoded secrets, sandboxed exec, input validation
6. OPERATIONAL READINESS - logging, error recovery, rollback plan
7. CONCURRENCY & ASYNC - tokio patterns, cancellation safety
8. BLIND SPOTS - missing edge cases, failure modes, unstated assumptions

OUTPUT FORMAT:

## 1. Completeness Check
[sections present/missing]

## 2. Architecture Assessment
**Strengths**: [what's done well]
**Concerns**: [issues to address]

## 3. Alignment with Handoff & Roadmap
[fit with docs/handoff.md and M1 scope]

## 4. Security Review
[assessment]

## 5. Implementation Concerns
[feedback on plan]

## 6. Concurrency & Async
[tokio patterns, cancellation]

## 7. Blind Spots
[what the design misses]

## 8. Verdict
[APPROVE | APPROVE_WITH_SUGGESTIONS | NEEDS_REVISION]

## 9. Actionable Feedback
[prioritized list]
"""

# Step 5: Synthesize validated reviews with failure telemetry
[[steps]]
name = "synthesis"
backend = "claude"
retries = 3
depends_on = ["gemini_review", "ollama_review", "claude_fallback"]
min_deps_success = 0
prompt = """
You are synthesizing findings from AI code reviewers of a loker design document. Cross-reference findings and produce a structured synthesis.

GEMINI REVIEW (success={{ steps.gemini_review.success }}):
{{ steps.gemini_review.output }}

OLLAMA REVIEW (success={{ steps.ollama_review.success }}):
{{ steps.ollama_review.output }}

CLAUDE FALLBACK:
{% if steps.claude_fallback is defined %}{{ steps.claude_fallback.output }}{% else %}SKIPPED - external reviewers succeeded{% endif %}

INSTRUCTIONS:

**First, emit a Reviewer Status section:**

## Reviewer Status
| Reviewer | Status | Detail |
|----------|--------|--------|
For each reviewer, show: OK, REVIEW_FAILED (with the failure reason), or SKIPPED (if the step did not run).

**Then, apply these synthesis rules:**

- If ALL reviews contain REVIEW_FAILED or are empty, return: NO_REVIEWS_AVAILABLE (after the status table).
- If exactly ONE review produced valid output (including Claude fallback), use it as the sole source. Use the "Single Review" format below.
- If TWO or more reviews produced valid output, cross-reference into the "Multi Review" format.

**Single Review format** (when only 1 reviewer succeeded):

## Source
[Which reviewer produced this review]

## Key Findings
| # | Finding | Severity |
|---|---------|----------|

## Verdict
[The single reviewer's verdict]

## Priority Actions
Ordered by severity.

**Multi Review format** (when 2+ reviewers succeeded):

## Agreement (High Confidence)
Items where 2+ reviewers independently identified the same concern.
| # | Finding | Severity |
|---|---------|----------|

## Disagreement (Needs Human Decision)
Items where reviewers hold divergent positions.
| # | Topic | Position A (Reviewer) | Position B (Reviewer) |
|---|-------|----------------------|----------------------|

## Novel Insights (Single Reviewer)
Items found by only one reviewer.
| # | Finding | Source | Severity |
|---|---------|--------|----------|

## Consolidated Verdict
- If ANY reviewer says NEEDS_REVISION -> Overall: NEEDS_REVISION
- If all say APPROVE -> Overall: APPROVE
- Otherwise -> Overall: APPROVE_WITH_SUGGESTIONS

## Priority Actions
Ordered by severity, agreement items first.

## Decision Recommendation
Based on the consolidated verdict and priority actions, recommend one of:
- PROCEED: Approve the design and move to implementation.
- PROCEED_WITH_FIXES: Approve once specific actionable items are addressed (list them).
- REVISE: Block until the design is reworked (list the blocking items).
"""

# Step 6: Write review files
[[steps]]
name = "write_reviews"
depends_on = ["gemini_review", "ollama_review", "claude_fallback", "synthesis"]
min_deps_success = 0
shell = """
mkdir -p docs/reviews
REVIEW_DATE=$(date +%Y-%m-%d)

printf '%s\n' '# Design Review: {{ arg.2 }}' '' '**Reviewer**: Gemini 3.1 Pro' "**Reviewed**: $REVIEW_DATE" '**Pipeline**: lok design-review' '' '---' '' > docs/reviews/{{ arg.2 }}-review-gemini.md
cat >> docs/reviews/{{ arg.2 }}-review-gemini.md << 'ENDGEMINI'
{{ steps.gemini_review.output }}
ENDGEMINI

printf '%s\n' '# Design Review: {{ arg.2 }}' '' '**Reviewer**: Codex via Ollama (glm-5.1:cloud)' "**Reviewed**: $REVIEW_DATE" '**Pipeline**: lok design-review' '' '---' '' > docs/reviews/{{ arg.2 }}-review-ollama.md
cat >> docs/reviews/{{ arg.2 }}-review-ollama.md << 'ENDOLLAMA'
{{ steps.ollama_review.output }}
ENDOLLAMA

{% if steps.claude_fallback is defined %}
FALLBACK_OUTPUT='{{ steps.claude_fallback.output }}'
if [ -n "$FALLBACK_OUTPUT" ] && ! echo "$FALLBACK_OUTPUT" | grep -q 'REVIEW_FAILED'; then
  printf '%s\n' '# Design Review: {{ arg.2 }}' '' '**Reviewer**: Claude (fallback)' "**Reviewed**: $REVIEW_DATE" '**Pipeline**: lok design-review' '**Note**: External reviewers failed; this is the fallback review' '' '---' '' > docs/reviews/{{ arg.2 }}-review-claude-fallback.md
  cat >> docs/reviews/{{ arg.2 }}-review-claude-fallback.md << 'ENDFALLBACK'
{{ steps.claude_fallback.output }}
ENDFALLBACK
fi
{% endif %}

printf '%s\n' '# Review Synthesis: {{ arg.2 }}' '' "**Synthesized**: $REVIEW_DATE" '**Pipeline**: lok design-review' '**Reviewers**: Gemini 3.1 Pro, Codex/Ollama (glm-5.1:cloud), Claude (fallback if needed)' '' '---' '' > docs/reviews/{{ arg.2 }}-review-synthesis.md
cat >> docs/reviews/{{ arg.2 }}-review-synthesis.md << 'ENDSYNTH'
{{ steps.synthesis.output }}
ENDSYNTH

echo "Reviews written to docs/reviews/{{ arg.2 }}-review-*.md"
"""
